name: Android APK

# Pull requests that change this file can be used to produce a verified
# installable build from the current mainline code.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ApexBooks-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
