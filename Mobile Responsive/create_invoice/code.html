<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>ApexInv - Create Invoice</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e5e8ee",
                        "on-primary-fixed-variant": "#24467c",
                        "surface-container": "#ebeef4",
                        "on-secondary-fixed": "#002110",
                        "on-secondary-fixed-variant": "#00522e",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2d3135",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#046d3f",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#d3e4f9",
                        "outline-variant": "#c4c6d1",
                        "primary-fixed": "#d7e2ff",
                        "tertiary-fixed-dim": "#b7c8dc",
                        "surface-variant": "#dfe3e8",
                        "secondary-fixed": "#9df5bc",
                        "surface": "#f7f9ff",
                        "primary": "#00193c",
                        "tertiary-container": "#20303f",
                        "primary-fixed-dim": "#abc7ff",
                        "on-background": "#181c20",
                        "surface-dim": "#d7dae0",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f1f4fa",
                        "on-primary-fixed": "#001b3f",
                        "outline": "#747781",
                        "on-tertiary-fixed-variant": "#384858",
                        "on-surface": "#181c20",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#0e7143",
                        "inverse-on-surface": "#eef1f7",
                        "primary-container": "#002d62",
                        "on-tertiary-container": "#8798aa",
                        "surface-bright": "#f7f9ff",
                        "on-primary-container": "#7796d1",
                        "background": "#f7f9ff",
                        "secondary-fixed-dim": "#81d9a1",
                        "on-surface-variant": "#43474f",
                        "tertiary": "#0a1b2a",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#abc7ff",
                        "surface-tint": "#3e5e95",
                        "surface-container-highest": "#dfe3e8",
                        "secondary-container": "#9af2b9",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#0c1d2b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "unit": "4px",
                        "xl": "32px",
                        "margin-tablet": "24px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "md": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "display-lg": ["Inter"],

                    "fontSize": {

                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            /* iOS safe area adjustments */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(116, 119, 129, 0.2);
            border-radius: 4px;
        }
        /* Outlined text field label transition */
        .peer:focus ~ .peer-label, .peer:not(:placeholder-shown) ~ .peer-label {
            transform: translateY(-1.25rem) scale(0.75);
            background-color: #f7f9ff;
            padding: 0 0.25rem;
            color: #002d62;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar (From JSON, modified for creation screen context) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline-variant/12 flex justify-between items-center h-14 px-margin-mobile">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 active:opacity-70 rounded-full p-2 -ml-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary dark:text-primary-fixed">Create Invoice</h1>
<button class="text-primary font-label-lg text-label-lg hover:bg-surface-container-low transition-colors duration-200 active:opacity-70 px-2 py-1 rounded">
            Draft
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pt-[4.5rem] pb-32 px-margin-mobile flex flex-col gap-lg">
<!-- 1. Customer Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-primary">Customer</h2>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="search">search</span>
</div>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-lowest border border-outline-variant/50 rounded-DEFAULT text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="customer-search" placeholder="Search customer..." type="text"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-colors" data-icon="add_circle">add_circle</span>
</div>
</div>
</section>
<!-- 2. Invoice Details Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-title-md text-title-md text-primary">Invoice Details</h2>
<!-- Date Input -->
<div class="relative">
<input class="peer w-full px-3 py-3 bg-surface-container-lowest border border-outline-variant/50 rounded-DEFAULT text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-transparent" id="invoice-date" placeholder="Date" type="date"/>
<label class="peer-label absolute left-2 top-3 text-on-surface-variant text-body-md transition-all duration-200 pointer-events-none" for="invoice-date">Date</label>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Number Input -->
<div class="relative">
<input class="peer w-full px-3 py-3 bg-surface-container-lowest border border-outline-variant/50 rounded-DEFAULT text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-transparent" id="invoice-number" placeholder="INV-0001" type="text" value="INV-2023-089"/>
<label class="peer-label absolute left-2 top-3 text-on-surface-variant text-body-md transition-all duration-200 pointer-events-none" for="invoice-number">Invoice #</label>
</div>
</section>
<!-- 3. Items Section -->
<section class="flex flex-col gap-md">
<div class="flex justify-between items-end">
<h2 class="font-title-md text-title-md text-primary">Line Items</h2>
</div>
<!-- List of Items -->
<div class="flex flex-col gap-sm">
<!-- Empty State (Hidden by default, shown if no items) -->
<!-- <div class="p-lg border border-dashed border-outline-variant/50 rounded-DEFAULT flex flex-col items-center justify-center text-center text-on-surface-variant">
                    <span class="material-symbols-outlined mb-2 text-[32px]" data-icon="receipt_long">receipt_long</span>
                    <p class="font-body-md text-body-md">No items added yet.</p>
                </div> -->
<!-- Item Card 1 -->
<div class="relative bg-surface-container-lowest border border-outline-variant/12 rounded-DEFAULT p-md shadow-[0_1px_2px_rgba(0,25,60,0.05)] flex gap-sm">
<div class="w-1 bg-primary rounded-l-DEFAULT absolute left-0 top-0 bottom-0"></div>
<div class="flex-1 flex flex-col gap-xs ml-1">
<div class="flex justify-between items-start">
<h3 class="font-title-md text-title-md text-on-surface font-medium line-clamp-1">Consulting Services (Q3)</h3>
<button class="text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<div class="flex justify-between items-center mt-1">
<div class="flex items-center gap-2">
<span class="font-body-md text-body-md text-on-surface-variant">Qty: 40</span>
<span class="text-outline-variant">•</span>
<span class="font-body-md text-body-md text-on-surface-variant">$150.00</span>
</div>
<span class="font-title-md text-title-md text-on-surface font-medium">$6,000.00</span>
</div>
</div>
</div>
<!-- Add Item Button -->
<button class="w-full py-3 border border-dashed border-primary/30 rounded-DEFAULT text-primary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="add">add</span>
                    Add Line Item
                </button>
</div>
</section>
<!-- 4. Summary Section -->
<section class="flex flex-col gap-sm bg-surface-container-lowest border border-outline-variant/12 rounded-DEFAULT p-md shadow-[0_1px_2px_rgba(0,25,60,0.05)] mb-lg">
<h2 class="font-title-md text-title-md text-primary border-b border-outline-variant/12 pb-2 mb-2">Summary</h2>
<div class="flex justify-between items-center py-1">
<span class="font-body-md text-body-md text-on-surface-variant">Subtotal</span>
<span class="font-body-md text-body-md text-on-surface">$6,000.00</span>
</div>
<div class="flex justify-between items-center py-1">
<span class="font-body-md text-body-md text-on-surface-variant">Tax (10%)</span>
<span class="font-body-md text-body-md text-on-surface">$600.00</span>
</div>
<!-- Discount Input Row -->
<div class="flex justify-between items-center py-1">
<span class="font-body-md text-body-md text-on-surface-variant">Discount</span>
<div class="flex items-center gap-2 w-32">
<span class="text-on-surface-variant">- $</span>
<input class="w-full py-1 px-2 border-b border-outline-variant/50 bg-transparent text-right font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary" placeholder="0.00" type="number" value="0.00"/>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-surface-container border-t border-outline-variant/12 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] px-margin-mobile py-4 pb-safe flex items-center justify-between">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Grand Total</span>
<span class="font-headline-md text-headline-md font-bold text-primary">$6,600.00</span>
</div>
<button class="bg-primary text-on-primary font-label-lg text-label-lg px-6 py-3 rounded-DEFAULT hover:bg-primary/90 transition-colors active:scale-95 shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="save">save</span>
            Save Invoice
        </button>
</div>
</body></html>
