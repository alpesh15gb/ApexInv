<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline-variant/12 fixed top-0 w-full z-50 transition-colors duration-200">
<div class="flex justify-between items-center h-14 px-margin-mobile w-full">
<button class="text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-highest p-2 rounded-full transition-colors duration-200 active:opacity-70 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary dark:text-primary-fixed">ApexInv</h1>
<button class="text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-highest p-2 rounded-full transition-colors duration-200 active:opacity-70 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[72px] pb-[88px] px-margin-mobile flex flex-col gap-md max-w-[840px] mx-auto w-full">
<!-- Header & Search -->
<div class="flex flex-col gap-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Purchase Orders</h2>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-low border border-outline-variant/12 rounded-lg font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="Search POs, vendors..." type="text"/>
</div>
</div>
<!-- Filter Chips -->
<div class="flex gap-sm overflow-x-auto pb-1 scrollbar-hide -mx-margin-mobile px-margin-mobile">
<button class="flex-shrink-0 h-8 px-4 rounded-full bg-secondary-container text-on-secondary-container font-label-lg text-label-lg">All</button>
<button class="flex-shrink-0 h-8 px-4 rounded-full bg-surface-container border border-outline-variant/20 text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high transition-colors">Draft</button>
<button class="flex-shrink-0 h-8 px-4 rounded-full bg-surface-container border border-outline-variant/20 text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high transition-colors">Confirmed</button>
<button class="flex-shrink-0 h-8 px-4 rounded-full bg-surface-container border border-outline-variant/20 text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high transition-colors">Received</button>
</div>
<!-- PO List -->
<div class="flex flex-col gap-sm">
<!-- PO Card 1 (Pending/Confirmed) -->
<div class="relative bg-surface border border-outline-variant/12 rounded-lg overflow-hidden shadow-[0_1px_2px_rgba(0,0,0,0.05)] flex flex-col">
<div class="absolute left-0 top-0 bottom-0 w-[4px] bg-primary"></div>
<div class="p-md pl-lg flex flex-col gap-xs">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">PO-2023-089</span>
<span class="font-body-md text-body-md text-on-surface-variant">TechFlow Supplies</span>
</div>
<div class="flex flex-col items-end">
<span class="font-title-md text-title-md text-on-surface">$4,520.00</span>
<span class="font-label-md text-label-md bg-tertiary-fixed text-on-tertiary-fixed px-2 py-0.5 rounded uppercase mt-1">Confirmed</span>
</div>
</div>
<hr class="border-outline-variant/12 my-1"/>
<div class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="calendar_today">calendar_today</span>
<span>Oct 24, 2023</span>
</div>
<span>12 items</span>
</div>
</div>
</div>
<!-- PO Card 2 (Draft) -->
<div class="relative bg-surface border border-outline-variant/12 rounded-lg overflow-hidden shadow-[0_1px_2px_rgba(0,0,0,0.05)] flex flex-col">
<div class="absolute left-0 top-0 bottom-0 w-[4px] bg-outline-variant"></div>
<div class="p-md pl-lg flex flex-col gap-xs">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">PO-2023-090</span>
<span class="font-body-md text-body-md text-on-surface-variant">Global Office Co.</span>
</div>
<div class="flex flex-col items-end">
<span class="font-title-md text-title-md text-on-surface">$850.50</span>
<span class="font-label-md text-label-md bg-surface-container-high text-on-surface-variant px-2 py-0.5 rounded uppercase mt-1">Draft</span>
</div>
</div>
<hr class="border-outline-variant/12 my-1"/>
<div class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="calendar_today">calendar_today</span>
<span>Oct 25, 2023</span>
</div>
<span>3 items</span>
</div>
</div>
</div>
<!-- PO Card 3 (Received) -->
<div class="relative bg-surface border border-outline-variant/12 rounded-lg overflow-hidden shadow-[0_1px_2px_rgba(0,0,0,0.05)] flex flex-col opacity-80">
<div class="absolute left-0 top-0 bottom-0 w-[4px] bg-secondary"></div>
<div class="p-md pl-lg flex flex-col gap-xs">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface line-through decoration-outline-variant">PO-2023-085</span>
<span class="font-body-md text-body-md text-on-surface-variant">Nexus Hardware</span>
</div>
<div class="flex flex-col items-end">
<span class="font-title-md text-title-md text-on-surface">$12,400.00</span>
<span class="font-label-md text-label-md bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded uppercase mt-1">Received</span>
</div>
</div>
<hr class="border-outline-variant/12 my-1"/>
<div class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="calendar_today">calendar_today</span>
<span>Oct 18, 2023</span>
</div>
<span>45 items</span>
</div>
</div>
</div>
</div>
</main>
<!-- FAB for New Purchase Order -->
<button class="fixed bottom-[88px] right-margin-mobile w-14 h-14 bg-primary-container text-on-primary-container rounded-xl shadow-md flex items-center justify-center hover:bg-primary transition-colors duration-200 z-40 active:scale-95">
<span class="material-symbols-outlined text-[24px]" data-icon="add">add</span>
</button>
<!-- BottomNavBar -->
<nav class="bg-surface-container dark:bg-surface-container border-t border-outline-variant/12 shadow-sm fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-2 pb-safe md:hidden transition-all duration-200">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all duration-200 active:scale-95">

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="description">description</span>
<span class="font-label-md text-label-md mt-1">Invoices</span>

<span class="material-symbols-outlined" data-icon="group" data-weight="fill" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-md text-label-md mt-1">Customers</span>

<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
