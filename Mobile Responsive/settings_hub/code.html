<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        .safe-pt {
            padding-top: env(safe-area-inset-top, 0px);

<body class="bg-background text-on-background antialiased h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center h-14 px-margin-mobile w-full bg-surface dark:bg-surface border-b border-outline-variant/12 fixed top-0 z-50 safe-pt">
<button aria-label="Menu" class="p-2 -ml-2 text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-200 active:opacity-70 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary dark:text-primary-fixed">ApexInv</h1>
<button aria-label="Refresh" class="p-2 -mr-2 text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-200 active:opacity-70 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto mt-14 mb-[72px] p-margin-mobile flex flex-col gap-sm">
<div class="py-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-unit">Settings Hub</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Manage your business preferences.</p>
</div>
<!-- Settings List Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/12 overflow-hidden flex flex-col">
<!-- Business Settings -->
<button class="flex items-center p-md border-b border-outline-variant/12 hover:bg-surface-container-low active:bg-surface-container transition-colors duration-200 text-left w-full group">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary mr-md group-active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="domain">domain</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface">Business</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Company Info, Address</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Data Settings -->
<button class="flex items-center p-md border-b border-outline-variant/12 hover:bg-surface-container-low active:bg-surface-container transition-colors duration-200 text-left w-full group">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary mr-md group-active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="database">database</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface">Data</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Backup, Import/Export</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Users Settings -->
<button class="flex items-center p-md border-b border-outline-variant/12 hover:bg-surface-container-low active:bg-surface-container transition-colors duration-200 text-left w-full group">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary mr-md group-active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="group">group</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface">Users</h3>
<p class="font-body-md text-body-md text-on-surface-variant">User Management, Roles</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Invoices Settings -->
<button class="flex items-center p-md border-b border-outline-variant/12 hover:bg-surface-container-low active:bg-surface-container transition-colors duration-200 text-left w-full group">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary mr-md group-active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface">Invoices</h3>
<p class="font-body-md text-body-md text-on-surface-variant">PDF Template, Taxes</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Appearance Settings -->
<button class="flex items-center p-md hover:bg-surface-container-low active:bg-surface-container transition-colors duration-200 text-left w-full group">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary mr-md group-active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="palette">palette</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface">Appearance</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Theme, Language</p>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<div class="mt-lg mb-xl">
<button class="w-full flex items-center justify-center gap-sm p-md rounded-lg text-error hover:bg-error-container/20 active:bg-error-container/40 transition-colors duration-200 font-label-lg text-label-lg border border-error/20">
<span class="material-symbols-outlined text-[20px]" data-icon="logout">logout</span>
                Log Out
            </button>
</div>

<div class="px-4 py-1 rounded-full group-hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="add_circle">add_circle</span>

<span class="font-label-md text-label-md">Invoices</span>

<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high transition-all duration-200 active:scale-95 group w-16">
<div class="px-4 py-1 rounded-full group-hover:bg-surface-variant/50 transition-colors">
