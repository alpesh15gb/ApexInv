name: apexbooks
description: "Apex Books - Invoice and billing management app built with Flutter"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 4.3.9
environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.11.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.6
  path: ^1.8.3
  path_provider: ^2.0.15
  file_picker: ^10.2.0
  permission_handler: ^12.0.1
  share_plus: ^11.0.0
  crypto: ^3.0.3
  cryptography: ^2.7.0
  uuid: ^4.0.0
  csv: ^6.0.0
  archive: ^4.0.0
  flutter_riverpod: ^2.5.1
  open_file: ^3.3.2
  url_launcher: ^6.2.6
  http: ^1.2.0
  fl_chart: ^0.69.0
  syncfusion_flutter_pdfviewer: ^30.1.40
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  flutter_svg: ^2.0.10+1
  image: ^4.2.0
  qr: ^3.0.1
  flex_color_picker: ^3.6.0
  thermal_printer: ^1.0.5
  flutter_esc_pos_utils: ^1.0.1
  supabase_flutter: ^2.5.0
  connectivity_plus: ^6.0.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename: ^1.10.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
   - assets/images/logo.png
   - assets/images/logo_dark.png
   - assets/images/logo.svg
   - assets/images/logo_v.png
   - assets/images/logo_v_dark.png
   - assets/fonts/
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSerifTibetan
      fonts:
        - asset: assets/fonts/NotoSerifTibetan-Regular.ttf
        - asset: assets/fonts/NotoSerifTibetan-Bold.ttf
          weight: 700

flutter_launcher_icons:
  macos:
    generate: true
    image_path: "assets/images/logo_v.png"

package_rename_config:
  linux:
    app_name: apexbooks
    package_name: apexbooks
    exe_name: apexbooks

  windows:
    app_name: ApexBooks
    organization: apexbooks
    copyright_notice: Copyright ©️ 2026 ApexBooks. All rights reserved.
    exe_name: ApexBooks

  web:
    app_name: Apex Books
    short_app_name: Apex Books
    description: Apex Books - Invoice and billing management app
